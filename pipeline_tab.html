    <!-- ==================== TAB 2: 브랜드사 등록 & 파이프라인 관리 ==================== -->
    <section id="tab-brands" class="tab-content hidden space-y-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        
        <!-- Header & Action Toolbar -->
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3 pb-4 border-b border-slate-200">
          <div>
            <div class="flex items-center space-x-2">
              <span class="px-2 py-0.5 rounded-md bg-indigo-50 border border-indigo-200 text-indigo-700 text-[11px] font-black">2026 GLOBAL PIPELINE</span>
              <h2 class="text-base font-black text-slate-900 flex items-center space-x-2">
                <i data-lucide="table-2" class="w-5 h-5 text-indigo-600"></i>
                <span>브랜드 & 파트너사 파이프라인 (Brand & Partner Pipeline 2026)</span>
              </h2>
            </div>
            <p class="text-xs text-slate-500 mt-1 flex flex-wrap items-center gap-2">
              <span>'Brand & Partner Pipeline 2026.xlsx' 원본 연동 스프레드시트</span>
              <span id="badgeExcelHiddenStatus" class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">
                🔒 엑셀 숨김 시트 5개(30건) 제외 모드 (13건 표시)
              </span>
            </p>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <!-- Toggle Excel Hidden Data Button -->
            <button type="button" id="btnToggleExcelHidden" onclick="toggleExcelHidden()" class="inline-flex items-center space-x-1.5 px-3 py-2 text-xs font-bold rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 shadow-2xs transition cursor-pointer" title="엑셀 파일에서 숨겨진 시트 5개 표시/비표시 전환">
              <i data-lucide="eye-off" id="iconExcelHidden" class="w-4 h-4 text-slate-500"></i>
              <span id="labelExcelHidden">엑셀 숨김: 비표시 (Southern Africa 13건)</span>
            </button>

            <!-- View Mode Switcher -->
            <div class="inline-flex p-1 bg-slate-100 rounded-xl border border-slate-200 text-xs font-bold">
              <button type="button" id="btnViewSpreadsheet" onclick="setBrandViewMode('spreadsheet')" class="px-3 py-1.5 rounded-lg bg-white shadow-2xs text-indigo-600 flex items-center space-x-1.5 transition">
                <i data-lucide="sheet" class="w-3.5 h-3.5"></i>
                <span>스프레드시트 표</span>
              </button>
              <button type="button" id="btnViewCards" onclick="setBrandViewMode('cards')" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 flex items-center space-x-1.5 transition">
                <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                <span>카드 그리드</span>
              </button>
            </div>

            <!-- Export to Excel Button -->
            <button type="button" onclick="exportPipelineToExcel()" class="inline-flex items-center space-x-1.5 px-3 py-2 text-xs font-bold rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition cursor-pointer">
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>엑셀 다운로드 (XLSX)</span>
            </button>

            <!-- New Brand Modal Button -->
            <button type="button" onclick="openNewBrandModal()" class="inline-flex items-center space-x-1.5 px-3.5 py-2 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white shadow-sm transition cursor-pointer">
              <i data-lucide="plus-circle" class="w-4 h-4"></i>
              <span>신규 브랜드사 등록</span>
            </button>
          </div>
        </div>

        <!-- Filter & Search Controls Toolbar -->
        <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-50/80 p-3 rounded-xl border border-slate-200 text-xs">
          <div class="flex flex-wrap items-center gap-2 flex-1 min-w-[280px]">
            <!-- Search Box -->
            <div class="relative flex-1 min-w-[200px]">
              <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
              <input type="text" id="pipelineSearchInput" oninput="handlePipelineFilterChange()" placeholder="브랜드명(한글/ENG), 카테고리, 담당자, 이메일, 독점국가 실시간 검색..." class="w-full pl-9 pr-3 py-1.5 bg-white border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Category Filter -->
            <select id="pipelineCategoryFilter" onchange="handlePipelineFilterChange()" class="border border-slate-300 bg-white rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="ALL">전체 카테고리</option>
              <option value="Skincare">스킨케어 (Skincare)</option>
              <option value="Make up">메이크업 (Make up)</option>
            </select>

            <!-- Status Filter -->
            <select id="pipelineStatusFilter" onchange="handlePipelineFilterChange()" class="border border-slate-300 bg-white rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="ALL">전체 진행현황 (Status)</option>
              <option value="Completed">체결/완료 (Completed)</option>
              <option value="In progress">소싱/논의중 (In progress)</option>
              <option value="Special">공급률/특약 협의</option>
            </select>

            <!-- Reset Filter Button -->
            <button type="button" onclick="resetPipelineFilters()" title="필터 초기화" class="p-1.5 bg-white border border-slate-200 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition">
              <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <!-- Quick Stats Chips -->
          <div class="flex items-center space-x-2 text-[11px] font-semibold shrink-0">
            <span class="px-2 py-0.5 rounded-md bg-indigo-50 border border-indigo-200 text-indigo-700">전체 <strong id="statTotalBrands">13</strong>개 (<span id="pipelineFilteredCount">13</span>개 표시)</span>
            <span class="px-2 py-0.5 rounded-md bg-emerald-50 border border-emerald-200 text-emerald-700">완료 <strong id="statCompletedBrands">3</strong>개</span>
            <span class="px-2 py-0.5 rounded-md bg-blue-50 border border-blue-200 text-blue-700">협의중 <strong id="statProgressBrands">10</strong>개</span>
          </div>
        </div>

        <!-- 1. SPREADSHEET TABLE VIEW (Default) -->
        <div id="pipelineSpreadsheetView" class="overflow-x-auto custom-scrollbar border border-slate-200 rounded-xl shadow-2xs max-h-[650px]">
          <table class="w-full min-w-[1380px] text-left text-xs border-collapse bg-white table-fixed">
            <colgroup>
              <col class="w-[50px]">
              <col class="w-[100px]">
              <col class="w-[140px]">
              <col class="w-[150px]">
              <col class="w-[260px]">
              <col class="w-[100px]">
              <col class="w-[200px]">
              <col class="w-[100px]">
              <col class="w-[210px]">
              <col class="w-[70px]">
            </colgroup>
            <thead class="bg-slate-100 text-slate-700 text-[11px] font-bold uppercase tracking-wider border-b border-slate-200 sticky top-0 z-10 shadow-2xs">
              <tr class="divide-x divide-slate-200">
                <th class="py-2.5 px-2 text-center bg-slate-100">No.</th>
                <th class="py-2.5 px-2 text-center cursor-pointer hover:bg-slate-200 transition bg-slate-100" onclick="sortPipeline('category')">Catogory ↕</th>
                <th class="py-2.5 px-3 cursor-pointer hover:bg-slate-200 transition bg-slate-100" onclick="sortPipeline('brandKor')">Brand (KOR) ↕</th>
                <th class="py-2.5 px-3 cursor-pointer hover:bg-slate-200 transition bg-slate-100" onclick="sortPipeline('brandEng')">Brand (ENG) ↕</th>
                <th class="py-2.5 px-3 bg-slate-100">Status (진행 현황)</th>
                <th class="py-2.5 px-2 text-center bg-slate-100">구글드라이브</th>
                <th class="py-2.5 px-3 bg-slate-100">메일 (POC)</th>
                <th class="py-2.5 px-2 text-center bg-slate-100">제안날짜</th>
                <th class="py-2.5 px-3 bg-slate-100">독점 체결 국가 / 제한 채널</th>
                <th class="py-2.5 px-2 text-center bg-slate-100">관리</th>
              </tr>
            </thead>
            <tbody id="pipelineSpreadsheetBody" class="divide-y divide-slate-200 text-slate-800">
              <!-- Dynamically populated rows -->
            </tbody>
          </table>
        </div>

        <!-- 2. CARD GRID VIEW (Alternative) -->
        <div id="pipelineCardsView" class="hidden">
          <div id="brandsListGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Dynamically populated cards -->
          </div>
        </div>

      </div>
    </section>
